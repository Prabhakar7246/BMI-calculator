<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h1>BMI Calculator</h1>
    <p class="subtitle">Body Mass Index</p>

    <div class="inputs">
      <div class="field">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" placeholder="e.g. 175" />
        <span class="err" id="height-err"></span>
      </div>
      <div class="field">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="e.g. 70" />
        <span class="err" id="weight-err"></span>
      </div>
    </div>

    <div class="btns">
      <button class="btn-primary" onclick="calculate()">Calculate</button>
      <button class="btn-secondary" onclick="reset()">Reset</button>
    </div>

    <div class="result hidden" id="result">
      <div class="bmi-display">
        <span class="bmi-value" id="bmi-value">--</span>
        <span class="bmi-label">BMI</span>
      </div>
      <div class="category" id="category"></div>
      <div class="meter">
        <div class="meter-fill" id="meter-fill"></div>
        <div class="meter-dot" id="meter-dot"></div>
      </div>
      <div class="meter-scale">
        <span>&lt;18.5</span>
        <span>18.5–24.9</span>
        <span>25–29.9</span>
        <span>30+</span>
      </div>
      <p class="message" id="message"></p>
      <p class="suggestion" id="suggestion"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
